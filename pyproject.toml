[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "super8"
dynamic = ["version"]
description = "A non-linear video editor for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["PyQt6>=6.6", "av>=12", "numpy>=1.26", "anthropic>=2.12"]

[project.optional-dependencies]
dev = ["pytest", "pyflakes", "setuptools>=77"]

[project.gui-scripts]
super8 = "super8.__main__:main"

# Discover packages automatically: a hand-written list once left out super8.ai and the snap
# (a normal, non-editable install) crashed on start. tests/test_packaging.py guards this.
[tool.setuptools.packages.find]
include = ["super8*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "super8.__version__"}

[tool.setuptools.package-data]
"super8.resources" = ["*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
