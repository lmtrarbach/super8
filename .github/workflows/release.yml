name: Build and release

# Push a tag like v0.1.0 to test, build the snap for amd64 and arm64, publish it to the
# Snap Store's stable channel and make a GitHub release with both .snap files attached.
# "Run workflow" on the Actions tab builds the snaps without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e '.[dev]'
      - run: python -m pyflakes super8 tests
      - run: python -m pytest -q   # generates its own sample media on first run
        env:
          QT_QPA_PLATFORM: offscreen

  snap:
    name: Snap (${{ matrix.arch }})
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # Set up once: see "Publishing the snap" in the README.
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' super8/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in super8/__init__.py"; exit 1
          fi
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
      # Release tags go to the Snap Store's stable channel (skipped until the
      # SNAPCRAFT_STORE_CREDENTIALS secret exists).
      - uses: snapcore/action-publish@v1
        if: startsWith(github.ref, 'refs/tags/') && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [snap]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: snap-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.snap
          generate_release_notes: true
