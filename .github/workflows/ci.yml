name: CI

# Every push and pull request: lint + tests.
# Pushes to main also build the snap for amd64 and arm64 and publish it to the Snap Store's
# edge channel (skipped until the SNAPCRAFT_STORE_CREDENTIALS secret exists), so the latest
# development build is always one `snap refresh super8-editor --edge` away.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]   # oldest supported, and the one the snap ships (core24)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e '.[dev]'
      - run: python -m pyflakes super8 tests
      - name: Sample media (cached between runs)
        uses: actions/cache@v4
        with:
          path: tests/.samples
          key: samples-${{ hashFiles('tools/make_samples.py') }}
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Installed app starts (non-editable install, as in the snap)
        run: |
          python -m venv /tmp/installed
          /tmp/installed/bin/pip install -q .
          cd /tmp && /tmp/installed/bin/python "$GITHUB_WORKSPACE/tools/smoke_start.py"
        env:
          QT_QPA_PLATFORM: offscreen

  snap:
    name: Snap (${{ matrix.arch }})
    needs: test
    # Pull requests only run the tests; building the snap takes ~15 minutes per architecture.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          retention-days: 14
      - uses: snapcore/action-publish@v1
        if: github.ref == 'refs/heads/main' && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge
