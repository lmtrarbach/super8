name: super8-editor
title: Super8
base: core24
adopt-info: super8   # version comes from super8/__init__.py
summary: Non-linear video editor with transitions, graphics and silence cutting
description: |
  Super8 is a free video editor for Linux in the spirit of Premiere.

  * Multi-track timeline with linked audio/video, snapping and unlimited undo
  * Editing tools: selection, track select, ripple, rolling, rate stretch,
    razor, slip, slide, hand, zoom and type
  * Transitions: dissolves, dips, wipes, pushes, iris, graphic sweeps and
    audio crossfades
  * Animated graphics: lower thirds, captions, credits rolls, tickers and
    your own reusable templates
  * Silence detector that cuts or speeds up pauses in talking-head footage,
    and background noise reduction
  * Export to H.264/AAC MP4, MKV or MOV
  * Optional AI assistant: sign in with your own Claude account and ask
    Claude to look at your footage and make edits for you

  Editing runs entirely on your computer. The network is used only by the
  optional AI assistant, with your Claude account, when you use it.
license: GPL-3.0-only
icon: snap/gui/super8.png
grade: stable
confinement: strict
platforms:
  amd64:
  arm64:

apps:
  super8:
    command: bin/super8
    extensions: [gnome]
    plugs:
      - home
      - removable-media   # footage on USB drives and SD cards
      - audio-playback    # preview playback
      - network           # only for the optional AI assistant (Claude sign-in and requests)
    environment:
      QT_QPA_PLATFORM: "wayland;xcb"

parts:
  super8:
    plugin: python
    source: .
    build-environment:
      # The gnome extension puts the GNOME SDK's Python packages on PYTHONPATH. Its old pip (24.0)
      # then shadows the virtualenv's own pip, and pip >= 26 crashes on start
      # ("cannot import name 'cli'"). Nothing in this part needs the SDK's Python modules.
      - PYTHONPATH: ""
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' super8/__init__.py)"
    override-build: |
      craftctl default
      # The GTK3 theme plugin in the PyQt6 wheel calls gtk_init(), which aborts when the GNOME
      # settings schemas don't match the GTK build. Super8 draws its own theme, so drop it.
      rm -f "$CRAFT_PART_INSTALL"/lib/python3*/site-packages/PyQt6/Qt6/plugins/platformthemes/libqgtk3.so
    stage-packages:
      # Qt Multimedia's audio output (preview playback) talks to PulseAudio / PipeWire.
      - libpulse0
      # Needed by Qt's X11 backend (used when Wayland isn't available).
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-xinerama0
      - libxcb-xkb1
      - libxkbcommon-x11-0

  ant:
    # Anthropic's official CLI (Apache-2.0), used only for "Sign in with Claude": its browser OAuth
    # login stores the user's token where the Anthropic SDK reads it. Pinned and checksum-verified.
    plugin: nil
    build-packages: [curl]
    override-build: |
      VERSION=2.12.1
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) SHA256=0ff27598096a89bb75c44c0f96e6be8eba405b6426febd54839391eafa6da69e ;;
        arm64) SHA256=2f203d4b3abd9305f094d31a0e9aa2b17e67a20a08145bf46d69f471a9f666c3 ;;
        *) echo "no ant build for $CRAFT_ARCH_BUILD_FOR" >&2; exit 1 ;;
      esac
      TARBALL="ant_${VERSION}_linux_${CRAFT_ARCH_BUILD_FOR}.tar.gz"
      curl -fsSL -o "$TARBALL" "https://github.com/anthropics/anthropic-cli/releases/download/v${VERSION}/${TARBALL}"
      echo "${SHA256}  ${TARBALL}" | sha256sum -c -
      tar -xzf "$TARBALL" ant LICENSE LICENSE-MIT
      install -Dm755 ant "$CRAFT_PART_INSTALL/bin/ant"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/usr/share/doc/anthropic-cli/LICENSE"
      install -Dm644 LICENSE-MIT "$CRAFT_PART_INSTALL/usr/share/doc/anthropic-cli/LICENSE-MIT"
